<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game App</title>
    <!-- Подключаем официальный скрипт Telegram Web Apps -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #2d2d2d;
        }
        h1 {
            color: #4caf50;
            margin-top: 0;
            font-size: 24px;
        }
        .user-card {
            background: #252525;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 15px;
            border-left: 4px solid #4caf50;
            text-align: left;
        }
        .status {
            color: #888;
            font-size: 13px;
            margin-top: 15px;
        }
        /* Сетка для отображения игровой валюты */
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .currency-item {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .currency-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .currency-icon {
            font-size: 20px;
        }
        .currency-name {
            font-size: 14px;
            color: #ccc;
        }
        .currency-value {
            font-weight: bold;
            font-size: 16px;
            color: #fff;
        }
        .btn-click {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.1s;
        }
        .btn-click:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Игровое Приложение</h1>

        <!-- Профиль игрока -->
        <div class="user-card">
            👤 <b>Игрок:</b> <span id="user-name">Загрузка...</span><br>
            🆔 <b>ID:</b> <span id="user-id">------</span>
        </div>

        <h3>🎒 Ваши ресурсы</h3>
        <!-- Сетка балансов (совпадает с ключами CURRENCY_KEYS из вашего бота) -->
        <div class="balance-grid">
            <div class="currency-item">
                <div class="currency-info"><span class="currency-icon">💵</span><span class="currency-name">Доллары</span></div>
                <div class="currency-value" id="val-usd">0</div>
            </div>
            <div class="currency-item">
                <div class="currency-info"><span class="currency-icon">🪙</span><span class="currency-name">Коины</span></div>
                <div class="currency-value" id="val-coin">0</div>
            </div>
            <div class="currency-item">
                <div class="currency-info"><span class="currency-icon">💎</span><span class="currency-name">Алмазы</span></div>
                <div class="currency-value" id="val-diamond">0</div>
            </div>
            <div class="currency-item">
                <div class="currency-info"><span class="currency-icon">🎃</span><span class="currency-name">Тыковки</span></div>
                <div class="currency-value" id="val-pumpkin">0</div>
            </div>
        </div>

        <!-- Кнопка действия для кликера -->
        <button class="btn-click" id="click-btn">🪙 Кликнуть (+1 Коин)</button>

        <p class="status" id="auth-status">Загрузка облачных сохранений...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let userBalances = { usd: 0, coin: 0, diamond: 0, pumpkin: 0 };

        function updateUI() {
            // Обновляем цифры на экране
            document.getElementById('val-usd').innerText = userBalances.usd;
            document.getElementById('val-coin').innerText = userBalances.coin;
            document.getElementById('val-diamond').innerText = userBalances.diamond;
            document.getElementById('val-pumpkin').innerText = userBalances.pumpkin;
        }

        function loadCloudBalances() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = user.first_name;
                document.getElementById('user-id').innerText = user.id;

                // Безопасная загрузка баланса из Telegram Cloud Storage
                try {
                    tg.CloudStorage.getItems(['player_balances'], (err, values) => {
                        if (!err && values && values.player_balances) {
                            userBalances = JSON.parse(values.player_balances);
                        }
                        updateUI();
                        document.getElementById('auth-status').innerText = "✅ Данные успешно синхронизированы!";
                    });
                } catch (e) {
                    document.getElementById('auth-status').innerText = "⚠️ Облако временно недоступно.";
                    updateUI();
                }
            } else {
                // Режим отображения в обычном браузере для тестов
                document.getElementById('user-name').innerText = "Тестовый Игрок";
                document.getElementById('user-id').innerText = "123456789";
                document.getElementById('auth-status').innerText = "🤖 Режим тестирования в браузере.";
                updateUI();
            }
        }

        // Логика клика
        document.getElementById('click-btn').addEventListener('click', () => {
            userBalances.coin += 1;
            updateUI();

            // Сохраняем клики в облако Telegram
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.CloudStorage.setItem('player_balances', JSON.stringify(userBalances), (err, success) => {
                    if (err) console.error("Ошибка сохранения в CloudStorage", err);
                });
            }
        });

        // Инициализация интерфейса
        tg.ready();
        tg.expand();
        loadCloudBalances();
    </script>
</body>
</html>
